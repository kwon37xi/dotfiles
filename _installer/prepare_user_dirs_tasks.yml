---
- name: 바탕화면 to Desktop
  shell: mv ~/바탕화면 ~/Desktop
  args:
    creates: ~/Desktop
    removes: ~/바탕화면
- name: 다운로드 to Downloads
  shell: mv ~/다운로드 ~/Downloads
  args:
    creates: ~/Downloads
    removes: ~/다운로드
- name: 서식 to Templates
  shell: mv ~/서식 ~/Templates
  args:
    creates: ~/Templates
    removes: ~/서식
- name: 공개 to Public
  shell: mv ~/공개 ~/Public
  args:
    creates: ~/Public
    removes: ~/공개
- name: 문서 to Documents
  shell: mv ~/문서 ~/Documents
  args:
    creates: ~/Documents
    removes: ~/문서
- name: 음악 to Music
  shell: mv ~/음악 ~/Music
  args:
    creates: ~/Music
    removes: ~/음악
- name: 사진 to Pictures
  shell: mv ~/사진 ~/Pictures
  args:
    creates: ~/Pictures
    removes: ~/사진
- name: 비디오 to Videos
  shell: mv ~/비디오 ~/Videos
  args:
    creates: ~/Videos
    removes: ~/비디오
- name: 프로젝트 to Projects
  shell: mv ~/프로젝트 ~/Projects
  args:
    creates: ~/Projects
    removes: ~/프로젝트
- name: xdg-user-dirs-update
  shell: |
    xdg-user-dirs-update --set DESKTOP $HOME/Desktop
    xdg-user-dirs-update --set DOWNLOAD $HOME/Downloads
    xdg-user-dirs-update --set TEMPLATES $HOME/Templates
    xdg-user-dirs-update --set PUBLICSHARE $HOME/Public
    xdg-user-dirs-update --set DOCUMENTS $HOME/Documents
    xdg-user-dirs-update --set MUSIC $HOME/Music
    xdg-user-dirs-update --set PICTURES $HOME/Pictures
    xdg-user-dirs-update --set VIDEOS $HOME/Videos
    xdg-user-dirs-update --set PROJECTS $HOME/Projects
- name: update nautilus bookmarks
  ansible.builtin.copy:
    dest: "/home/{{ current_user }}/.config/gtk-3.0/bookmarks"
    force: true
    content: |
      file:///home/kwon37xi/Downloads Downloads
      file:///home/kwon37xi/Documents Documents
      file:///home/kwon37xi/Desktop Desktop
      file:///home/kwon37xi/Projects Projects
      file:///home/kwon37xi/Pictures Pictures
      file:///home/kwon37xi/Music Music
      file:///home/kwon37xi/Videos Videos
